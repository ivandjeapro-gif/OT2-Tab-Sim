name: Deploy simulation web
# Build l'application Flutter Web sur chaque push main, puis publie sur Pages.
# https://ivandjeapro-gif.github.io/OT2-Tab-Sim/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # L'application est hébergée dans /OT2-Tab-Sim/, pas à la racine.
      - run: flutter build web --release --base-href /OT2-Tab-Sim/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
